name: Android

on:
  push:
    paths: ['android/**', 'ios/TowerRiotKit/**', 'ios/TowerRiot/TowerRiot/Art/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'ios/TowerRiotKit/**', 'ios/TowerRiot/TowerRiot/Art/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests (same results as the web game)
        working-directory: android
        run: ./gradlew :engine:test --no-daemon
      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: TowerRiot-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
